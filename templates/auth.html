<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SignMark</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(30, 30, 50, 0.95);
            border: 1px solid rgba(141, 133, 255, 0.25);
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-description {
            text-align: center;
            margin-bottom: 25px;
            color: #b9b9cb;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #25253d;
            color: white;
        }

        .auth-tabs button.active {
            background: #8d85ff;
            color: #fff;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form label {
            display: block;
            margin: 12px 0 6px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #44445c;
            background: #17172a;
            color: white;
        }

        .auth-submit {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #8d85ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 15px;
            text-align: center;
            color: #ff9b9b;
        }

        .auth-back {
            text-align: center;
            margin-top: 20px;
        }

        .auth-back a {
            color: #aaa1ff;
           text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Sign<span>Mark.</span></div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
        </div>
    </nav>

    <!-- AUTH SECTION -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Welcome to <span>SignMark</span></h1>

            <p class="auth-description">
                Sign in or create your account to continue.
            </p>

            <!-- TABS -->
            <div class="auth-tabs">
                <button id="loginTab" class="active" type="button">
                    Login
                </button>

                <button id="registerTab" type="button">
                    Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form active">

                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    required
                    placeholder="Enter your email"
                >

                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    required
                    placeholder="Enter your password"
                >

                <button type="submit" class="auth-submit">
                    Login
                </button>

            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" class="auth-form">

                <label for="firstName">First Name</label>
                <input
                    type="text"
                    id="firstName"
                    required
                    placeholder="First name"
                >

                <label for="lastName">Last Name</label>
                <input
                    type="text"
                    id="lastName"
                    required
                    placeholder="Last name"
                >

                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    required
                    placeholder="Enter your email"
                >

                <label for="dateOfBirth">Date of Birth</label>
                <input
                    type="date"
                    id="dateOfBirth"
                    required
                >

                <label for="registerPassword">Password</label>
                <input
                    type="password"
                    id="registerPassword"
                    minlength="8"
                    maxlength="128"
                    required
                    placeholder="Minimum 8 characters"
                >

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

            </form>

            <!-- MESSAGE -->
            <p id="authMessage" class="auth-message"></p>

            <div class="auth-back">
                <a href="/">← Back to Home</a>
            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 SignMark. Making communication accessible.</p>
    </footer>

    <!-- AUTH JAVASCRIPT -->
    <script>

        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");

        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");

        const authMessage = document.getElementById("authMessage");

        // Switch to Login
        loginTab.addEventListener("click", function () {

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

            loginForm.classList.add("active");
            registerForm.classList.remove("active");

            authMessage.textContent = "";

        });

        // Switch to Register
        registerTab.addEventListener("click", function () {

            registerTab.classList.add("active");
            loginTab.classList.remove("active");

            registerForm.classList.add("active");
            loginForm.classList.remove("active");

            authMessage.textContent = "";

        });

        // LOGIN
        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            authMessage.textContent = "Logging in...";

            const data = {
                email: document.getElementById("loginEmail").value,
                password: document.getElementById("loginPassword").value
            };

            try {

                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    authMessage.style.color = "#8dffb0";
                    authMessage.textContent = "Login successful!";

                    window.location.href = "/home";
                } else {
                    authMessage.style.color = "#ff9b9b";
                    authMessage.textContent =
                        result.message || result.error?.message || "Login failed.";
                }

            } catch (error) {

                authMessage.style.color = "#ff9b9b";
                authMessage.textContent =
                    "Server connection failed. Please try again.";

            }

        });

        // REGISTER
        registerForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            authMessage.textContent = "Creating account...";

            const data = {
                first_name: document.getElementById("firstName").value,
                last_name: document.getElementById("lastName").value,
                email: document.getElementById("registerEmail").value,
                date_of_birth: document.getElementById("dateOfBirth").value,
                password: document.getElementById("registerPassword").value
            };

            try {

                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {

                    authMessage.style.color = "#8dffb0";
                    authMessage.textContent =
                        "Account created successfully!";

                    window.location.href = "/home";

                } else {

                    authMessage.style.color = "#ff9b9b";
                    authMessage.textContent =
                        result.message || result.error?.message || "Registration failed.";

                }

            } catch (error) {

                authMessage.style.color = "#ff9b9b";
                authMessage.textContent =
                    "Server connection failed. Please try again.";

            }

        });

    </script>

</body>
</html>
